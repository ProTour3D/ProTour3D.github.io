<!-- ===== КНОПКА МУЗЫКИ ===== -->
<button id="music-toggle" aria-label="Включить музыку" title="Включить музыку">
    <svg id="music-icon-on" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
    <svg id="music-icon-off" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
        <circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4"/>
        <circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4"/>
        <line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
</button>

<!-- Скрытый аудиоплеер -->
<audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

<style>
    #music-toggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #e0e0e0;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: transform 0.2s, box-shadow 0.2s;
        padding: 0;
    }
    #music-toggle:hover {
        transform: scale(1.08);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    }
    #music-toggle svg {
        width: 26px;
        height: 26px;
        color: #1a2a4a;
    }
    #music-toggle.playing {
        background: #5ba3f5;
        border-color: #5ba3f5;
    }
    #music-toggle.playing svg {
        color: #ffffff;
    }
    @media (max-width: 480px) {
        #music-toggle {
            width: 46px;
            height: 46px;
            bottom: 15px;
            right: 15px;
        }
        #music-toggle svg {
            width: 22px;
            height: 22px;
        }
    }
</style>

<script>
    (function () {
        var btn = document.getElementById('music-toggle');
        var audio = document.getElementById('bg-music');
        var iconOn = document.getElementById('music-icon-on');
        var iconOff = document.getElementById('music-icon-off');

        // Громкость — 25% (фоновая). Измените на 0.15–0.4 по вкусу.
        audio.volume = 0.25;

        btn.addEventListener('click', function () {
            if (audio.paused) {
                audio.play();
                btn.classList.add('playing');
                btn.setAttribute('title', 'Выключить музыку');
                iconOn.style.display = 'block';
                iconOff.style.display = 'none';
            } else {
                audio.pause();
                btn.classList.remove('playing');
                btn.setAttribute('title', 'Включить музыку');
                iconOn.style.display = 'none';
                iconOff.style.display = 'block';
            }
        });
    })();
</script>
